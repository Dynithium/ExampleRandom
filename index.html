<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minslaire - Village Prototype</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="game-container">
        <header id="hud">
            <div class="stat-group">
                <div class="stat hp-stat">
                    <span class="label">HP</span>
                    <div class="bar-container">
                        <div id="hp-fill" class="bar-fill" style="width: 100%;"></div>
                    </div>
                    <span class="val"><span id="hp">100</span>/100</span>
                </div>
                <div class="stat st-stat">
                    <span class="label">ST</span>
                    <div class="bar-container">
                        <div id="st-fill" class="bar-fill" style="width: 100%;"></div>
                    </div>
                    <span class="val"><span id="st">100</span>/100</span>
                </div>
            </div>
            <div class="stat location-stat">
                <span class="label loc-label">LOC</span>
                <span id="location-name">Elderville Village</span>
            </div>
        </header>
        <div id="canvas-wrapper">
            <canvas id="gameCanvas" width="480" height="320"></canvas>
        </div>
        <footer id="controls-hint">
            <div class="hint-item"><strong>Move:</strong> WASD / Arrows</div>
            <div class="hint-item"><strong>Interact/Talk:</strong> E / Space</div>
            <div class="hint-item"><strong>Sprint:</strong> Hold Shift</div>
        </footer>
    </div>
    <script src="game.js"></script>
</body>
</html>
