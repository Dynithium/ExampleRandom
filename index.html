<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pixel Quest - Top Down Adventure</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #1a1c2c; color: #fff; font-family: 'Press Start 2P', cursive;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            min-height: 100vh; overflow: hidden; image-rendering: pixelated;
        }
        .game-wrapper {
            position: relative; border: 4px solid #5d6d7e; border-radius: 4px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.5);
        }
        canvas { display: block; image-rendering: pixelated; }
        .ui-overlay {
            position: absolute; top: 10px; left: 10px; right: 10px;
            display: flex; justify-content: space-between; pointer-events: none; z-index: 10;
        }
        .health-bar { display: flex; gap: 4px; }
        .heart {
            width: 20px; height: 20px; background-color: #e74c3c;
            clip-path: polygon(50% 0%, 100% 35%, 82% 100%, 50% 80%, 18% 100%, 0% 35%);
        }
        .heart.empty { background-color: #555; }
        .score-display { color: #f1c40f; text-shadow: 2px 2px #000; }
        .start-screen, .game-over-screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(26, 28, 44, 0.95); display: flex; flex-direction: column;
            align-items: center; justify-content: center; z-index: 20; text-align: center;
        }
        .game-over-screen { display: none; }
        h1 { color: #3498db; text-shadow: 4px 4px #000; margin-bottom: 20px; font-size: 24px; line-height: 1.5; }
        .subtitle { color: #95a5a6; font-size: 10px; margin-bottom: 30px; line-height: 1.8; }
        .btn {
            font-family: 'Press Start 2P', cursive; background: #e74c3c; color: #fff;
            border: 4px solid #c0392b; padding: 15px 30px; font-size: 12px; cursor: pointer;
            text-transform: uppercase; box-shadow: 4px 4px #000; transition: transform 0.1s;
        }
        .btn:hover { transform: translate(-2px, -2px); box-shadow: 6px 6px #000; }
        .btn:active { transform: translate(2px, 2px); box-shadow: 2px 2px #000; }
        .controls-hint { margin-top: 30px; color: #7f8c8d; font-size: 8px; line-height: 2; }
        .final-score { color: #f1c40f; margin: 20px 0; font-size: 14px; }
        .mobile-controls { display: none; margin-top: 20px; }
        .dpad { display: grid; grid-template-columns: repeat(3, 50px); grid-template-rows: repeat(3, 50px); gap: 5px; }
        .dpad-btn {
            background: #34495e; border: 3px solid #2c3e50; border-radius: 8px; color: #fff;
            font-size: 20px; cursor: pointer; display: flex; align-items: center; justify-content: center;
        }
        .dpad-btn:active { background: #3498db; }
        .dpad-up { grid-column: 2; grid-row: 1; }
        .dpad-left { grid-column: 1; grid-row: 2; }
        .dpad-right { grid-column: 3; grid-row: 2; }
        .dpad-down { grid-column: 2; grid-row: 3; }
        @media (max-width: 600px) { .mobile-controls { display: flex; } h1 { font-size: 16px; } }
    </style>
</head>
<body>
    <div class="game-wrapper">
        <canvas id="gameCanvas" width="480" height="480"></canvas>
        <div class="ui-overlay">
            <div class="health-bar" id="healthBar"><div class="heart"></div><div class="heart"></div><div class="heart"></div></div>
            <div class="score-display" id="scoreDisplay">GOLD: 0</div>
        </div>
        <div class="start-screen" id="startScreen">
            <h1>PIXEL QUEST</h1>
            <div class="subtitle">A TOP-DOWN ADVENTURE</div>
            <button class="btn" id="startBtn">START GAME</button>
            <div class="controls-hint">WASD or ARROW KEYS to move<br>Collect gold coins<br>Avoid red enemies<br>Reach the green portal</div>
        </div>
        <div class="game-over-screen" id="gameOverScreen">
            <h1 style="color: #e74c3c;">GAME OVER</h1>
            <div class="final-score" id="finalScore">GOLD COLLECTED: 0</div>
            <button class="btn" id="restartBtn">TRY AGAIN</button>
        </div>
    </div>
    <div class="mobile-controls">
        <div class="dpad">
            <button class="dpad-btn dpad-up" data-dir="up">▲</button>
            <button class="dpad-btn dpad-left" data-dir="left">◀</button>
            <button class="dpad-btn dpad-right" data-dir="right">▶</button>
            <button class="dpad-btn dpad-down" data-dir="down">▼</button>
        </div>
    </div>
    <script>
        const canvas = document.getElementById('gameCanvas'), ctx = canvas.getContext('2d');
        const TILE_SIZE = 24, COLS = canvas.width / TILE_SIZE, ROWS = canvas.height / TILE_SIZE;
        let gameState = 'start', score = 0, health = 3, currentLevel = 1;
        let player = { x: 2, y: 2, dx: 0, dy: 0, moveCooldown: 0, invincible: 0 };
        let coins = [], enemies = [], walls = [], portal = { x: 0, y: 0 };
        const COLORS = { floor: '#2c3e50', wall: '#5d6d7e', wallTop: '#7f8c8d', player: '#3498db', playerDark: '#2980b9', coin: '#f1c40f', coinShine: '#f9e79f', enemy: '#e74c3c', enemyDark: '#c0392b', portal: '#2ecc71', portalInner: '#27ae60' };

        function initLevel(level) {
            player.x = 2; player.y = 2; player.dx = 0; player.dy = 0; player.moveCooldown = 0;
            walls = []; coins = []; enemies = [];
            generateWalls(level);
            for (let i = 0; i < 5 + level * 2; i++) spawnCoin();
            for (let i = 0; i < 2 + level; i++) spawnEnemy();
            placePortal();
        }

        function generateWalls(level) {
            for (let x = 0; x < COLS; x++) { walls.push({ x, y: 0 }); walls.push({ x, y: ROWS - 1 }); }
            for (let y = 0; y < ROWS; y++) { walls.push({ x: 0, y }); walls.push({ x: COLS - 1, y }); }
            const density = Math.min(0.15 + level * 0.02, 0.3);
            for (let x = 2; x < COLS - 2; x++) for (let y = 2; y < ROWS - 2; y++) if (Math.random() < density && !(x < 4 && y < 4)) walls.push({ x, y });
        }

        function isValidPosition(x, y) { return x >= 0 && x < COLS && y >= 0 && y < ROWS && !walls.some(w => w.x === x && w.y === y); }

        function spawnCoin() { let x, y; do { x = Math.floor(Math.random() * (COLS - 2)) + 1; y = Math.floor(Math.random() * (ROWS - 2)) + 1; } while (!isValidPosition(x, y) || (x === player.x && y === player.y) || coins.some(c => c.x === x && c.y === y)); coins.push({ x, y, collected: false }); }
        function spawnEnemy() { let x, y, dx, dy; do { x = Math.floor(Math.random() * (COLS - 4)) + 2; y = Math.floor(Math.random() * (ROWS - 4)) + 2; dx = Math.random() < 0.5 ? 1 : -1; dy = 0; } while (!isValidPosition(x, y) || (Math.abs(x - player.x) < 5 && Math.abs(y - player.y) < 5)); enemies.push({ x, y, dx, dy, moveTimer: 0 }); }
        function placePortal() { let x, y; do { x = Math.floor(Math.random() * (COLS - 4)) + 2; y = Math.floor(Math.random() * (ROWS - 4)) + 2; } while (!isValidPosition(x, y) || (Math.abs(x - player.x) < 8 && Math.abs(y - player.y) < 8)); portal = { x, y }; }

        document.addEventListener('keydown', e => { if (gameState !== 'playing') return; switch(e.key) { case 'ArrowUp': case 'w': case 'W': if (player.dy === 0) { player.dx = 0; player.dy = -1; } break; case 'ArrowDown': case 's': case 'S': if (player.dy === 0) { player.dx = 0; player.dy = 1; } break; case 'ArrowLeft': case 'a': case 'A': if (player.dx === 0) { player.dx = -1; player.dy = 0; } break; case 'ArrowRight': case 'd': case 'D': if (player.dx === 0) { player.dx = 1; player.dy = 0; } break; }});
        document.querySelectorAll('.dpad-btn').forEach(btn => btn.addEventListener('click', () => { if (gameState !== 'playing') return; const dir = btn.dataset.dir; if (dir === 'up' && player.dy === 0) { player.dx = 0; player.dy = -1; } else if (dir === 'down' && player.dy === 0) { player.dx = 0; player.dy = 1; } else if (dir === 'left' && player.dx === 0) { player.dx = -1; player.dy = 0; } else if (dir === 'right' && player.dx === 0) { player.dx = 1; player.dy = 0; } }));

        function update() {
            if (gameState !== 'playing') return;
            if (player.moveCooldown <= 0 && (player.dx !== 0 || player.dy !== 0)) {
                const newX = player.x + player.dx, newY = player.y + player.dy;
                if (isValidPosition(newX, newY)) { player.x = newX; player.y = newY; player.moveCooldown = 8; coins.forEach(coin => { if (!coin.collected && coin.x === player.x && coin.y === player.y) { coin.collected = true; score += 10; updateUI(); }}); if (player.x === portal.x && player.y === portal.y) { currentLevel++; initLevel(currentLevel); }}
            }
            if (player.moveCooldown > 0) player.moveCooldown--; if (player.invincible > 0) player.invincible--;
            enemies.forEach(enemy => { enemy.moveTimer++; if (enemy.moveTimer >= 15) { enemy.moveTimer = 0; let newX = enemy.x + enemy.dx, newY = enemy.y + enemy.dy; if (!isValidPosition(newX, newY)) { if (enemy.dx !== 0) { enemy.dx = 0; enemy.dy = Math.random() < 0.5 ? 1 : -1; } else { enemy.dx = Math.random() < 0.5 ? 1 : -1; enemy.dy = 0; }} else { enemy.x = newX; enemy.y = newY; } if (enemy.x === player.x && enemy.y === player.y && player.invincible <= 0) { health--; player.invincible = 60; updateUI(); if (health <= 0) gameOver(); }}});
        }

        function render() {
            ctx.fillStyle = COLORS.floor; ctx.fillRect(0, 0, canvas.width, canvas.height);
            walls.forEach(wall => { ctx.fillStyle = COLORS.wall; ctx.fillRect(wall.x * TILE_SIZE, wall.y * TILE_SIZE, TILE_SIZE, TILE_SIZE); ctx.fillStyle = COLORS.wallTop; ctx.fillRect(wall.x * TILE_SIZE, wall.y * TILE_SIZE, TILE_SIZE, TILE_SIZE - 4); });
            ctx.fillStyle = COLORS.portal; ctx.fillRect(portal.x * TILE_SIZE + 2, portal.y * TILE_SIZE + 2, TILE_SIZE - 4, TILE_SIZE - 4); ctx.fillStyle = COLORS.portalInner; ctx.fillRect(portal.x * TILE_SIZE + 6, portal.y * TILE_SIZE + 6, TILE_SIZE - 12, TILE_SIZE - 12);
            coins.forEach(coin => { if (!coin.collected) { ctx.fillStyle = COLORS.coin; ctx.beginPath(); ctx.arc(coin.x * TILE_SIZE + TILE_SIZE/2, coin.y * TILE_SIZE + TILE_SIZE/2, TILE_SIZE/3, 0, Math.PI*2); ctx.fill(); ctx.fillStyle = COLORS.coinShine; ctx.beginPath(); ctx.arc(coin.x * TILE_SIZE + TILE_SIZE/2 - 2, coin.y * TILE_SIZE + TILE_SIZE/2 - 2, TILE_SIZE/6, 0, Math.PI*2); ctx.fill(); }});
            enemies.forEach(enemy => { ctx.fillStyle = COLORS.enemy; ctx.fillRect(enemy.x * TILE_SIZE + 2, enemy.y * TILE_SIZE + 2, TILE_SIZE - 4, TILE_SIZE - 4); ctx.fillStyle = COLORS.enemyDark; ctx.fillRect(enemy.x * TILE_SIZE + 4, enemy.y * TILE_SIZE + 4, TILE_SIZE - 8, TILE_SIZE - 12); ctx.fillStyle = '#fff'; ctx.fillRect(enemy.x * TILE_SIZE + 6, enemy.y * TILE_SIZE + 6, 4, 4); ctx.fillRect(enemy.x * TILE_SIZE + 14, enemy.y * TILE_SIZE + 6, 4, 4); ctx.fillStyle = '#000'; ctx.fillRect(enemy.x * TILE_SIZE + 7, enemy.y * TILE_SIZE + 7, 2, 2); ctx.fillRect(enemy.x * TILE_SIZE + 15, enemy.y * TILE_SIZE + 7, 2, 2); });
            if (player.invincible % 4 < 2) { ctx.fillStyle = COLORS.player; ctx.fillRect(player.x * TILE_SIZE + 2, player.y * TILE_SIZE + 2, TILE_SIZE - 4, TILE_SIZE - 4); ctx.fillStyle = COLORS.playerDark; ctx.fillRect(player.x * TILE_SIZE + 4, player.y * TILE_SIZE + 4, TILE_SIZE - 8, TILE_SIZE - 8); ctx.fillStyle = '#fff'; ctx.fillRect(player.x * TILE_SIZE + 6, player.y * TILE_SIZE + 6, 4, 4); ctx.fillRect(player.x * TILE_SIZE + 14, player.y * TILE_SIZE + 6, 4, 4); ctx.fillStyle = '#000'; ctx.fillRect(player.x * TILE_SIZE + 7, player.y * TILE_SIZE + 7, 2, 2); ctx.fillRect(player.x * TILE_SIZE + 15, player.y * TILE_SIZE + 7, 2, 2); }}
        }

        function updateUI() { document.getElementById('scoreDisplay').textContent = `GOLD: ${score}`; const healthBar = document.getElementById('healthBar'); healthBar.innerHTML = ''; for (let i = 0; i < 3; i++) { const heart = document.createElement('div'); heart.className = 'heart' + (i >= health ? ' empty' : ''); healthBar.appendChild(heart); }}
        function gameOver() { gameState = 'gameover'; document.getElementById('finalScore').textContent = `GOLD COLLECTED: ${score}`; document.getElementById('gameOverScreen').style.display = 'flex'; }
        function startGame() { score = 0; health = 3; currentLevel = 1; gameState = 'playing'; initLevel(1); updateUI(); document.getElementById('startScreen').style.display = 'none'; document.getElementById('gameOverScreen').style.display = 'none'; }
        document.getElementById('startBtn').addEventListener('click', startGame); document.getElementById('restartBtn').addEventListener('click', startGame);
        function gameLoop() { update(); render(); requestAnimationFrame(gameLoop); }
        gameLoop();
    </script>
</body>
</html>
